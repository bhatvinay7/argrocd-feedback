name: Bootstrap ArgoCD
on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
permissions:
    id-token: write
    contents: read   

jobs:
  install-argocd:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repo
        uses: actions/checkout@v3

      - name : Install CA for AWS eks
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.ACTION_ROLE}}
          aws-region: ${{secrets.AWS_REGION}}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Configure kubeconfig
        run: |
          
          export KUBERNETES_CLUSTER_NAME=${{secrets.KUBERNETES_CLUSTER_NAME}}
          export AWS_REGION=${{secrets.AWS_REGION}}
          aws eks update-kubeconfig --region $AWS_REGION --name $KUBERNETES_CLUSTER_NAME
          kubectl get nodes

      - name: Install the ingress-controller
        run: |
          helm upgrade --install ingress-nginx ingress-nginx --repo https://kubernetes.github.io/ingress-nginx --namespace ingress-nginx --create-namespace

      
      - name: Install ArgoCD and Add gitops to ArgoCD
        run: |
          export DOCKER_USERNAME=${{secrets.DOCKER_USERNAME}}
          export TOKEN=${{secrets.TOKEN}}
          export ARGOCD_PASSWORD=${{secrets.ARGOCD_ADMIN_PASSWORD}}
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm uninstall argocd --namespace feedback --ignore-not-found
          helm install argocd argo/argo-cd --namespace feedback \
          --create-namespace

      - name: Wait for ArgoCD pods
        run: kubectl wait --for=condition=available --timeout=300s deployment -n feedback --all
      
  Deploy :
    environment: staging
    needs: install-argocd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repo
        uses: actions/checkout@v3
      
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name : Install CA for AWS eks
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.ACTION_ROLE}}
          aws-region: ${{secrets.AWS_REGION}}

      - name: Configure kubeconfig
        run: |
          export KUBERNETES_CLUSTER_NAME=${{secrets.KUBERNETES_CLUSTER_NAME}}
          export AWS_REGION=${{secrets.AWS_REGION}}
          aws eks update-kubeconfig --region $AWS_REGION --name $KUBERNETES_CLUSTER_NAME
          kubectl get nodes
          kubectl config get-contexts
      
      - name: Install ArgoCD CLI and agrocd
        run: |
          kubectl apply -n feedback -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.1.8/manifests/ha/install.yaml
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

