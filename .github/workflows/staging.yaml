      - name : Add metric argocd-server
        run : |
             helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
             helm upgrade --install metrics-server metrics-server/metrics-server --namespace kube-system \
             --set image.repository=registry.k8s.io/metrics-server/metrics-server \
             --set image.tag=v0.7.2 \
             --set "args={--kubelet-insecure-tls,--kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname}"

      - name: ArgoCD login
        run: |
          export ARGOCD_ADMIN_PASSWORD=$(printf "%s" "${{secrets.ARGOCD_ADMIN_PASSWORD}}" | htpasswd -Bn -i -)
          export GITOPS_URL=${{secrets.GITOPS_URL}}
          export DOCKER_USERNAME=${{secrets.DOCKER_USERNAME}}
          export TOKEN=${{secrets.TOKEN}}

          kubectl patch secret argocd-secret -n feedback -p '{"data": {"admin.password": null, "admin.passwordMtime": null}}'

          kubectl rollout restart deployment argocd-server -n feedback

          kubectl -n feedback get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d

          kubectl port-forward svc/argocd-server -n feedback 8080:443 &  sleep 5 

          export ARGOCD_OPTS='--port-forward-namespace feedback'

          ARGOCD_NAMESPACE="feedback"

          INITIAL_PASSWORD=$(kubectl -n "$ARGOCD_NAMESPACE" get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d)

          argocd login localhost:8080 --insecure --username admin --password $INITIAL_PASSWORD

          argocd repo add  $GITOPS_URL \
            --username $DOCKER_USERNAME \
            --password $TOKEN --upsert
  

      - name : pull application.yaml file
        run: |
          export BRANCH=${{secrets.BRANCH}}
          export MANIFEST_REPO=${{secrets.MANIFEST_REPO}}
          export TOKEN=${{secrets.TOKEN}}
          export DOCKER_USERNAME=${{secrets.DOCKER_USERNAME}}
 
          sudo apt-get update && sudo apt-get install -y git
          mkdir -p ~/argocd
          git clone --branch $BRANCH https://$TOKEN@github.com/$DOCKER_USERNAME/$MANIFEST_REPO.git  ~/argocd     
     
      - name : Install helm charts
        run: |
           helm repo add bitnami https://charts.bitnami.com/bitnami
           helm repo update

      - name: kubectl apply run applications
        run: | 
          cd  ~/argocd
          kubectl apply -f aplications/project/rbac.app.yaml -n argocd
          kubectl apply -f applications/project/secrets.app.yaml -n feedback
          kubectl apply -f applications/manifest/secrets.yaml -n feedback
          kubectl apply -f applications/project/kafka-cluster.app.yaml -n feedback
          kubectl apply -f applications/project/reach-frontend.app.yaml -n feedback
          kubectl apply -f applications/project/reach-backend.app.yaml -n feedback
          kubectl apply -f applications/project/reach-ws-server.app.yaml -n feedback
          kubectl apply -f applications/project/reach-consumer1.app.yaml -n feedback
          kubectl apply -f applications/project/reach-consumer2.app.yaml -n feedback 
          kubectl apply -f applications/project/ingress.app.yaml -n feedback

          
          kubectl rollout restart deployment  -n feedback
          kubectl rollout restart deployment  -n feedback-services
          kubectl rollout restart deployment  -n kafka



